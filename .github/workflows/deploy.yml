name: Deploy to Cloud Run

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGION: us-central1
  FRONTEND_SERVICE: unmai-frontend
  BACKEND_SERVICE: unmai-backend
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: unmai-repo

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Auth Option 1: Workload Identity Federation (preferred, no key rotation needed)
      # Requires: WIF_PROVIDER and WIF_SERVICE_ACCOUNT secrets
      # Auth Option 2: Service Account Key (simpler setup)
      # Requires: GCP_SA_KEY secret (JSON key file content)
      - name: Authenticate to Google Cloud (WIF)
        if: ${{ secrets.WIF_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud (SA Key)
        if: ${{ secrets.WIF_PROVIDER == '' }}
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      # ── Build & Push Backend ──
      - name: Build backend image
        run: |
          docker build \
            -t ${{ env.ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }} \
            -t ${{ env.ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_SERVICE }}:latest \
            ./backend

      - name: Push backend image
        run: |
          docker push --all-tags ${{ env.ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_SERVICE }}

      - name: Deploy backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.BACKEND_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_SERVICE }}:${{ github.sha }}
          flags: |
            --port=8080
            --memory=2Gi
            --cpu=2
            --timeout=900
            --min-instances=0
            --max-instances=10
            --concurrency=80
          env_vars: |
            NODE_ENV=production
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}
            FIRESTORE_DATABASE_ID=unmai-ai-2025
            ALLOWED_ORIGINS=https://unmai-ai.run.place,https://www.unmai-ai.run.place
          secrets: |
            GEMINI_API_KEY=gemini-api-key:latest
            JWT_SECRET=jwt-secret:latest

      - name: Verify backend health
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)')
          echo "Backend URL: $BACKEND_URL"
          # Wait for cold start
          sleep 5
          curl -f -s --retry 3 --retry-delay 5 --max-time 30 "$BACKEND_URL/health"
          echo ""
          echo "Backend health check passed"

      # ── Build & Push Frontend ──
      - name: Set backend URL in frontend .env.production
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --format='value(status.url)')
          printf 'NEXT_PUBLIC_API_BASE_URL=%s\nNODE_ENV=production\nNEXT_TELEMETRY_DISABLED=1\nGENERATE_SOURCEMAP=false\n' "$BACKEND_URL" > frontend/.env.production
          echo "Frontend will use backend: $BACKEND_URL"

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ env.ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }} \
            -t ${{ env.ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_SERVICE }}:latest \
            ./frontend

      - name: Push frontend image
        run: |
          docker push --all-tags ${{ env.ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_SERVICE }}

      - name: Deploy frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.FRONTEND_SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_SERVICE }}:${{ github.sha }}
          flags: |
            --port=3000
            --memory=1Gi
            --cpu=1
            --timeout=300
            --min-instances=0
            --max-instances=5
          env_vars: |
            NODE_ENV=production

      # ── Post-Deploy Verification ──
      - name: Verify full deployment
        run: |
          BACKEND_URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} --region ${{ env.REGION }} --format='value(status.url)')
          FRONTEND_URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} --region ${{ env.REGION }} --format='value(status.url)')

          echo "=== Deployment Complete ==="
          echo "Backend:  $BACKEND_URL"
          echo "Frontend: $FRONTEND_URL"

          # Verify backend
          curl -f -s --max-time 30 "$BACKEND_URL/health" || exit 1
          echo ""

          # Verify frontend
          curl -f -s --max-time 30 "$FRONTEND_URL" > /dev/null || exit 1

          echo "All health checks passed"
