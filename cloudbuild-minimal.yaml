# Minimal Working Cloud Build for Unmai.ai
# Strategy: Build backend first → Get URL → Build frontend with backend URL → Verify connectivity

substitutions:
  _REGION: us-central1
  _FRONTEND_SERVICE: unmai-frontend
  _BACKEND_SERVICE: unmai-backend
  _ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  _REPOSITORY: unmai-repo

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100

timeout: 1200s

images:
  - ${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-frontend:$BUILD_ID
  - ${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-backend:$BUILD_ID

steps:
  # Step 1: Setup environment
  - id: setup-environment
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        echo "🚀 Unmai.ai Production Build Pipeline"
        echo "Project: $PROJECT_ID | Build: $BUILD_ID | Region: ${_REGION}"
        gcloud auth configure-docker ${_ARTIFACT_REGISTRY}
        echo "✅ Environment setup completed"

  # Step 2: Build backend Docker image
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    dir: backend
    args:
      - build
      - --cache-from=${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-backend:latest
      - -t=${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-backend:$BUILD_ID
      - -t=${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-backend:latest
      - .
    waitFor: ['setup-environment']

  # Step 3: Push backend image
  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-backend"]
    waitFor: ['build-backend']

  # Step 4: Deploy backend to Cloud Run
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        echo "🚀 Deploying backend..."
        gcloud run deploy ${_BACKEND_SERVICE} \
          --image ${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-backend:$BUILD_ID \
          --region ${_REGION} \
          --platform managed \
          --port 3001 \
          --memory=2Gi \
          --cpu=2 \
          --timeout=900 \
          --min-instances=0 \
          --max-instances=10 \
          --set-env-vars NODE_ENV=production \
          --set-env-vars GCP_PROJECT_ID=$PROJECT_ID \
          --set-secrets GEMINI_API_KEY=gemini-api-key:latest \
          --set-secrets GOOGLE_CUSTOM_SEARCH_API_KEY=google-custom-search-api-key:latest \
          --set-secrets GOOGLE_SEARCH_ENGINE_ID=google-search-engine-id:latest \
          --allow-unauthenticated \
          --quiet
        echo "✅ Backend deployed"
    waitFor: ['push-backend']

  # Step 5: Get backend URL and configure frontend
  - id: configure-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        echo "🔗 Configuring frontend with backend URL..."
        BACKEND_URL=$$(gcloud run services describe ${_BACKEND_SERVICE} --region ${_REGION} --format='value(status.url)')
        echo "✅ Backend URL: $$BACKEND_URL"
        
        # Create frontend production environment with backend URL
        echo "NEXT_PUBLIC_API_BASE_URL=$$BACKEND_URL" > frontend/.env.production
        echo "NODE_ENV=production" >> frontend/.env.production
        echo "NEXT_TELEMETRY_DISABLED=1" >> frontend/.env.production
        echo "GENERATE_SOURCEMAP=false" >> frontend/.env.production
        
        echo "✅ Frontend configured to connect to: $$BACKEND_URL"
    waitFor: ['deploy-backend']

  # Step 6: Build frontend Docker image with backend URL
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    dir: frontend
    args:
      - build
      - --cache-from=${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-frontend:latest
      - -t=${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-frontend:$BUILD_ID
      - -t=${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-frontend:latest
      - .
    waitFor: ['configure-frontend']

  # Step 7: Push frontend image
  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-frontend"]
    waitFor: ['build-frontend']

  # Step 8: Deploy frontend to Cloud Run
  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        echo "🚀 Deploying frontend..."
        gcloud run deploy ${_FRONTEND_SERVICE} \
          --image ${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-frontend:$BUILD_ID \
          --region ${_REGION} \
          --platform managed \
          --port 3000 \
          --memory=1Gi \
          --cpu=1 \
          --timeout=300 \
          --min-instances=0 \
          --max-instances=5 \
          --set-env-vars NODE_ENV=production \
          --allow-unauthenticated \
          --quiet
        echo "✅ Frontend deployed"
    waitFor: ['push-frontend']

  # Step 9: Verify frontend-backend connectivity
  - id: verify-connectivity
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        echo "🔍 Verifying frontend-backend connectivity..."
        BACKEND_URL=$$(gcloud run services describe ${_BACKEND_SERVICE} --region ${_REGION} --format='value(status.url)')
        FRONTEND_URL=$$(gcloud run services describe ${_FRONTEND_SERVICE} --region ${_REGION} --format='value(status.url)')
        
        # Test backend health
        echo "Testing backend health..."
        if curl -f -s "$$BACKEND_URL/health" > /dev/null; then
          echo "✅ Backend health check passed"
        else
          echo "❌ Backend health check failed"
          exit 1
        fi
        
        # Test backend API (simulating frontend request)
        echo "Testing backend API..."
        API_RESPONSE=$$(curl -s -X POST "$$BACKEND_URL/api/analyze" \
          -H "Content-Type: application/json" \
          -H "Origin: $$FRONTEND_URL" \
          -d '{"type":"text","payload":{"text":"connectivity test"}}' \
          --max-time 60)
        
        if echo "$$API_RESPONSE" | grep -q "analysisLabel"; then
          echo "✅ Backend API responding correctly"
        else
          echo "❌ Backend API not responding correctly"
          exit 1
        fi
        
        # Test frontend
        echo "Testing frontend..."
        if curl -f -s "$$FRONTEND_URL" > /dev/null; then
          echo "✅ Frontend accessible"
        else
          echo "❌ Frontend not accessible"
          exit 1
        fi
        
        echo "✅ All connectivity tests passed!"
    waitFor: ['deploy-frontend']

  # Step 10: Final deployment summary
  - id: deployment-summary
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        echo ""
        echo "🎉 DEPLOYMENT COMPLETED SUCCESSFULLY!"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        BACKEND_URL=$$(gcloud run services describe ${_BACKEND_SERVICE} --region ${_REGION} --format='value(status.url)')
        FRONTEND_URL=$$(gcloud run services describe ${_FRONTEND_SERVICE} --region ${_REGION} --format='value(status.url)')
        echo ""
        echo "🌐 Live Application URLs:"
        echo "   Frontend: $$FRONTEND_URL"
        echo "   Backend:  $$BACKEND_URL"
        echo ""
        echo "🔗 Connectivity Status:"
        echo "   ✅ Frontend ↔ Backend: Connected"
        echo "   ✅ CORS: Configured"
        echo "   ✅ API: Responding"
        echo ""
        echo "🚀 Your application is live and ready to use!"
        echo "   Open the frontend URL in your browser to start using unmai.ai"
        echo "   Open the frontend URL in your browser to start using unmai.ai"
    waitFor: ['verify-connectivity']
