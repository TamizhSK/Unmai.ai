# Minimal Working Cloud Build for Unmai.ai
# Strategy: Build backend first → Get URL → Build frontend with backend URL → Verify connectivity

substitutions:
  _REGION: us-central1
  _FRONTEND_SERVICE: unmai-frontend
  _BACKEND_SERVICE: unmai-backend
  _ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  _REPOSITORY: unmai-repo

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100

timeout: 1200s

images:
  - ${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-frontend:$BUILD_ID
  - ${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-backend:$BUILD_ID

steps:
  # Step 1: Setup environment
  - id: setup-environment
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ec
      - |
        echo "Unmai.ai Production Build Pipeline"
        echo "Project: $PROJECT_ID | Build: $BUILD_ID | Region: ${_REGION}"
        gcloud auth configure-docker ${_ARTIFACT_REGISTRY} --quiet
        echo "Environment setup completed"

  # Step 2: Build backend Docker image
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    dir: backend
    args:
      - build
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - --cache-from=${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-backend:latest
      - -t=${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-backend:$BUILD_ID
      - -t=${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-backend:latest
      - .
    waitFor: ['setup-environment']

  # Step 3: Push backend image
  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-backend"]
    waitFor: ['build-backend']

  # Step 4: Deploy backend to Cloud Run
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ec
      - |
        echo "Deploying backend..."

        # Build secrets flags only if secrets exist
        SECRET_FLAGS=""
        if gcloud secrets describe gemini-api-key --project $PROJECT_ID >/dev/null 2>&1; then
          SECRET_FLAGS="$$SECRET_FLAGS --set-secrets=GEMINI_API_KEY=gemini-api-key:latest"
        else
          echo "WARNING: Secret 'gemini-api-key' not found, skipping. Set GEMINI_API_KEY via env var instead."
        fi
        if gcloud secrets describe jwt-secret --project $PROJECT_ID >/dev/null 2>&1; then
          SECRET_FLAGS="$$SECRET_FLAGS --set-secrets=JWT_SECRET=jwt-secret:latest"
        else
          echo "WARNING: Secret 'jwt-secret' not found, skipping. Set JWT_SECRET via env var instead."
        fi

        gcloud run deploy ${_BACKEND_SERVICE} \
          --image ${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-backend:$BUILD_ID \
          --region ${_REGION} \
          --project $PROJECT_ID \
          --platform managed \
          --port 8080 \
          --memory=2Gi \
          --cpu=2 \
          --timeout=900 \
          --min-instances=0 \
          --max-instances=10 \
          --concurrency=80 \
          --set-env-vars='^|^NODE_ENV=production|GCP_PROJECT_ID=$PROJECT_ID|GOOGLE_CLOUD_PROJECT=$PROJECT_ID|FIRESTORE_DATABASE_ID=unmai-ai-2025|ALLOWED_ORIGINS=https://unmai-ai.run.place,https://www.unmai-ai.run.place' \
          $$SECRET_FLAGS \
          --no-allow-unauthenticated || true

        # Allow unauthenticated access (non-fatal if SA lacks setIamPolicy permission)
        gcloud run services add-iam-policy-binding ${_BACKEND_SERVICE} \
          --region=${_REGION} \
          --project=$PROJECT_ID \
          --member=allUsers \
          --role=roles/run.invoker || echo "WARNING: Could not set IAM policy. Run manually: gcloud run services add-iam-policy-binding ${_BACKEND_SERVICE} --region=${_REGION} --member=allUsers --role=roles/run.invoker"

        echo "Backend deployed successfully"
    waitFor: ['push-backend']

  # Step 5: Verify backend is healthy (frontend uses permanent custom domain)
  - id: verify-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ec
      - |
        BACKEND_URL=$$(gcloud run services describe ${_BACKEND_SERVICE} --region ${_REGION} --project $PROJECT_ID --format='value(status.url)')
        echo "Backend deployed at: $$BACKEND_URL"
        echo "Frontend will use permanent URL: https://api.unmai-ai.run.place"
        curl -f -s --max-time 30 "$$BACKEND_URL/health" || echo "WARNING: Backend health check failed (may need cold start)"
    waitFor: ['deploy-backend']

  # Step 6: Build frontend Docker image with backend URL (reads .env.production written by step 5)
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    dir: frontend
    args:
      - build
      - --cache-from=${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-frontend:latest
      - -t=${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-frontend:$BUILD_ID
      - -t=${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-frontend:latest
      - .
    waitFor: ['verify-backend']

  # Step 7: Push frontend image
  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-frontend"]
    waitFor: ['build-frontend']

  # Step 8: Deploy frontend to Cloud Run
  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ec
      - |
        echo "Deploying frontend..."
        gcloud run deploy ${_FRONTEND_SERVICE} \
          --image ${_ARTIFACT_REGISTRY}/$PROJECT_ID/${_REPOSITORY}/unmai-frontend:$BUILD_ID \
          --region ${_REGION} \
          --project $PROJECT_ID \
          --platform managed \
          --port 3000 \
          --memory=1Gi \
          --cpu=1 \
          --timeout=300 \
          --min-instances=0 \
          --max-instances=5 \
          --set-env-vars=NODE_ENV=production \
          --no-allow-unauthenticated || true

        # Allow unauthenticated access (non-fatal)
        gcloud run services add-iam-policy-binding ${_FRONTEND_SERVICE} \
          --region=${_REGION} \
          --project=$PROJECT_ID \
          --member=allUsers \
          --role=roles/run.invoker || echo "WARNING: Could not set IAM policy. Run manually: gcloud run services add-iam-policy-binding ${_FRONTEND_SERVICE} --region=${_REGION} --member=allUsers --role=roles/run.invoker"

        echo "Frontend deployed successfully"
    waitFor: ['push-frontend']

  # Step 9: Verify frontend-backend connectivity
  - id: verify-connectivity
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ec
      - |
        echo "Verifying deployment..."
        BACKEND_URL=$$(gcloud run services describe ${_BACKEND_SERVICE} --region ${_REGION} --project $PROJECT_ID --format='value(status.url)')
        FRONTEND_URL=$$(gcloud run services describe ${_FRONTEND_SERVICE} --region ${_REGION} --project $PROJECT_ID --format='value(status.url)')

        echo "Backend:  $$BACKEND_URL"
        echo "Frontend: $$FRONTEND_URL"

        # Test backend health
        echo "Testing backend health..."
        curl -f -s --max-time 30 "$$BACKEND_URL/health" || { echo "Backend health check failed"; exit 1; }
        echo ""
        echo "Backend health check passed"

        # Test frontend
        echo "Testing frontend..."
        curl -f -s --max-time 30 "$$FRONTEND_URL" > /dev/null || { echo "Frontend not accessible"; exit 1; }
        echo "Frontend accessible"

        echo ""
        echo "=========================================="
        echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
        echo "=========================================="
        echo "Frontend: $$FRONTEND_URL"
        echo "Backend:  $$BACKEND_URL"
        echo "=========================================="
    waitFor: ['deploy-frontend']
